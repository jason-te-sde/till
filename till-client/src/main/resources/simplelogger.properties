# tillctl prints what it means to print. Logging is off by default and turned on for one run with:
#
#   java -Dorg.slf4j.simpleLogger.defaultLogLevel=debug -jar tillctl.jar ...
#
# Read only when the shaded command line jar is on the classpath; a service using till-client as a
# library has its own configuration and its own binding, and this file is not in that jar.
org.slf4j.simpleLogger.defaultLogLevel=off
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
