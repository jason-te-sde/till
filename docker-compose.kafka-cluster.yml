# Three Kafka brokers instead of docker-compose.yml's one, so the replicated configuration
# infra/ runs on AWS is actually exercised somewhere (infra/README.md's "Kafka is three brokers on
# Fargate, not MSK"). Not the default stack, because three Kafka JVMs are most of a gigabyte more
# than one, and nothing about the outbox, the storefront or the load test needs replication to be
# exercised every time they are:
#
#   docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml up -d --wait till
#
# `kafka` (docker-compose.yml) becomes node 1 of three; `kafka-2` and `kafka-3` are the other two,
# the same image and shape. All three are given explicitly, here, rather than left to default:
#
#   - CLUSTER_ID, the same on all three. Left unset, every node falls back to a value baked into
#     the image — the *same* value on all three, so replication would even happen to work, but by
#     an accident of the base image rather than a decision this file records. KRaft refuses to let
#     a node join a quorum under a different cluster id than the one already running.
#   - KAFKA_CONTROLLER_QUORUM_VOTERS lists every node by the hostname the others reach it at
#     (its Compose service name), including itself — unlike a single node, which can simply dial
#     itself at `localhost`.
#   - KAFKA_DEFAULT_REPLICATION_FACTOR, the offsets and transaction-log replication settings, and
#     KAFKA_MIN_INSYNC_REPLICAS=2, so every topic this cluster creates for itself — and, through
#     TILL_KAFKA_REPLICATION_FACTOR below, the one the ledger declares — has three copies of each
#     partition and takes a write once two of them have it.
#
# No port is published to the host for kafka-2 or kafka-3: nothing outside the Compose network
# needs to reach a broker directly, the same as the base file's `kafka`.
services:
  kafka:
    environment:
      CLUSTER_ID: &cluster-id c07nhuCHSUWg4fASOqrfsg
      KAFKA_CONTROLLER_QUORUM_VOTERS: &voters "1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_DEFAULT_REPLICATION_FACTOR: &rf "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: *rf
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: *rf
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: &isr "2"
      KAFKA_MIN_INSYNC_REPLICAS: *isr

  kafka-2:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: *cluster-id
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: *voters
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: *rf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: *rf
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: *rf
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: *isr
      KAFKA_MIN_INSYNC_REPLICAS: *isr
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-3:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: *cluster-id
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: *voters
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: *rf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: *rf
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: *rf
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: *isr
      KAFKA_MIN_INSYNC_REPLICAS: *isr
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 20s

  # The ledger and the store get every broker, and the ledger is told there are three to replicate
  # to. Both wait on all three being healthy, not just the one the base file names.
  till:
    depends_on:
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      TILL_KAFKA_BROKERS: kafka:9092,kafka-2:9092,kafka-3:9092
      TILL_KAFKA_REPLICATION_FACTOR: "3"

  store:
    depends_on:
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      STORE_KAFKA_BROKERS: kafka:9092,kafka-2:9092,kafka-3:9092
