name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: sign and upload to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The secrets below cannot live in the repository, so this job does nothing until a maintainer
    # supplies them. SETUP-PUBLISHING.md is what they follow.
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: deploy
        run: mvn -B -ntp deploy -Prelease,publish -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Deliberately not auto-published: a version on Central can never be replaced, so it is looked
      # at in the portal before it becomes permanent. See RELEASING.md.
      - run: echo "Uploaded as a staged deployment. Publish it from the Central portal."
