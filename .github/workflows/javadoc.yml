name: Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One site over every module, so a link from the kernel to the adapter resolves.
      # doclint rejects a broken reference or malformed HTML, which is what makes the published
      # documentation worth linking to from the README.
      - name: aggregate javadoc
        run: mvn -B -ntp install -DskipTests && mvn -B -ntp javadoc:aggregate -Prelease

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/reports/apidocs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
