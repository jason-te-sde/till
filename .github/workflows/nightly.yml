name: Nightly

on:
  schedule:
    # 03:17 UTC. Not on the hour, because everything is on the hour and the runners are busier then.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many simulator seeds to sweep'
        default: '10000'

permissions:
  contents: read

jobs:
  soak:
    name: soak ${{ github.event.inputs.seeds || '10000' }} seeds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B -ntp install -DskipTests

      # A pull request cannot afford this and it is where the interesting bugs are: the first three
      # bugs in the README's list came from widening a sweep, not from writing another unit test.
      - name: sweep
        run: |
          mvn -B -ntp test -pl till-testkit \
            -Dtill.sim.seeds=${{ github.event.inputs.seeds || '10000' }} \
            -Dtest=SoakTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-reports
          path: '**/target/surefire-reports/**'
          retention-days: 30

  jdk-preview:
    name: build on the next JDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational. A JDK that is not released yet failing -Werror is not a reason to go red on a
    # schedule, and finding out six months early is worth a yellow tick.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26-ea'
          cache: maven
      - run: mvn -B -ntp verify -DskipTests
