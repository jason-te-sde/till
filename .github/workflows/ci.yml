name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The whole job is about two minutes. Anything approaching this is hung, and the six hour default
    # means a hung job holds a runner for an afternoon before anyone notices.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    services:
      # A service container rather than Testcontainers, so that the suite is not paying to start a
      # container twice. TILL_TEST_DB_URL names the server; each module creates a database of its
      # own on it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U till -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TILL_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      TILL_TEST_DB_USER: till
      TILL_TEST_DB_PASSWORD: till

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compiles with -Werror, runs every test, and enforces that each declared module exists and
      # that dependency versions converge across modules.
      - name: verify
        run: mvn -B -ntp verify

      # CI is set, so RequiresDatabase fails rather than skips when it cannot reach a database. This
      # asserts the other half: that the suites which need one actually ran. A build where they all
      # skipped is the failure this project is most exposed to.
      - name: the database-backed suites actually ran
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' till-jdbc/target/surefire-reports/*.xml \
                      till-server/target/surefire-reports/*.xml \
                    | grep -o '[0-9]*' | paste -sd+ - | bc)
          ran=$(grep -ho 'tests="[0-9]*"' till-jdbc/target/surefire-reports/*.xml \
                  till-server/target/surefire-reports/*.xml \
                | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "postgres-backed modules: $ran tests, $skipped skipped"
          test "$skipped" -eq 0
          test "$ran" -gt 50

      # Surefire already wrote the failing assertion and its stack trace to disk. Without this they
      # are deleted when the job ends, and the summary says only that Maven exited non-zero, so
      # diagnosing a red run means downloading the raw log and grepping it.
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U till -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TILL_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      TILL_TEST_DB_USER: till
      TILL_TEST_DB_PASSWORD: till

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One JDK rather than the matrix: the JaCoCo agent has to understand the class file version it
      # runs against, which makes it the first thing to break on a new JDK release.
      - run: mvn -B -ntp verify -Dcoverage

      - name: summary
        run: |
          python3 - <<'PY'
          import csv, pathlib
          lm = lc = bm = bc = 0
          for path in sorted(pathlib.Path('.').rglob('jacoco.csv')):
              module_lm = module_lc = 0
              with path.open() as handle:
                  for row in csv.DictReader(handle):
                      module_lm += int(row['LINE_MISSED']); module_lc += int(row['LINE_COVERED'])
                      bm += int(row['BRANCH_MISSED']); bc += int(row['BRANCH_COVERED'])
              lm += module_lm; lc += module_lc
              total = module_lm + module_lc
              if total:
                  print(f"{str(path.parts[0]):16} {100 * module_lc / total:5.1f}% lines")
          print(f"{'overall':16} {100 * lc / (lm + lc):5.1f}% lines, {100 * bc / (bm + bc):5.1f}% branches")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          retention-days: 7

  web:
    name: the console (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The version the Maven build pins, and the next one. Same reasoning as the JDK matrix: a
        # lint or a type rule that changes between releases should fail before it is released.
        node: ['24', '26']
    defaults:
      run:
        working-directory: till-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: till-web/package-lock.json

      # `ci`, not `install`: it installs exactly the lock file and fails if the lock and the
      # manifest disagree.
      - run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test:coverage

      # The committed openapi.json is what the TypeScript types are generated from. If regenerating
      # them changes the file, somebody changed the API and did not regenerate — which is a frontend
      # compiling against types for an API that no longer exists.
      - name: the generated types are current
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run api:types' in till-web and commit it."
            exit 1
          }

      - name: build
        run: npm run build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-coverage-node${{ matrix.node }}
          path: till-web/coverage/**
          retention-days: 7

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: till
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U till -d till"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: till-web/package-lock.json

      # The jar with the console inside it, which is what a release ships and therefore what the
      # end-to-end suite should be driving. Serving the bundle from a separate dev server would
      # leave the service's own route forwarding untested.
      - name: build the jar with the console in it
        run: mvn -B -ntp -Pweb package -DskipTests

      - name: start it
        run: |
          nohup java -jar till-server/target/till-server-*.jar \
            --server.address=127.0.0.1 \
            --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/till \
            --spring.datasource.username=till --spring.datasource.password=till \
            --till.auth.client-token=ci-client --till.auth.admin-token=ci-admin \
            > /tmp/till.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9101/actuator/health/readiness >/dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the service did not become ready"; cat /tmp/till.log; exit 1

      - name: the service really is serving the console
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 200
          # An enumerated forward, not a catch-all: a route the console has is a page, and a path
          # nobody has is still a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ops)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404

      - name: install the browser
        working-directory: till-web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # TILL_WEB pointing at the service means Playwright drives the bundled console over the same
      # origin the API is on, exactly as a deployment serves it.
      - name: run it
        working-directory: till-web
        env:
          CI: 'true'
          TILL_WEB: http://127.0.0.1:8080
          TILL_API: http://127.0.0.1:8080
          TILL_TOKEN: ci-admin
        run: npx playwright test

      - name: service log
        if: always()
        run: tail -200 /tmp/till.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            till-web/playwright-report/**
            till-web/test-results/**
          retention-days: 7

  container:
    name: the container stack works
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Cached across runs because the first stage resolves the whole Maven dependency tree. Without
      # a cache that download is repeated on every pull request and is most of the job's wall time.
      - name: build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: till:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --wait blocks until every service reports healthy, which for till is its own readiness
      # probe. If it cannot reach the database, this fails here rather than in the next step.
      - name: bring the stack up
        run: docker compose up -d --wait

      # The README claims this works. Claiming it and checking it are different things, and a
      # Dockerfile that has never been built is documentation of an intention.
      - name: a hold, a replay, and a sale
        run: |
          set -euo pipefail
          docker compose run --rm tillctl adjust widget 100
          held=$(docker compose run --rm tillctl reserve widget:2 --key=ci-8123 | awk '{print $1}' | tr -d '\r')
          test -n "$held"

          # The same key again. It must return the same reservation and take nothing more.
          again=$(docker compose run --rm tillctl reserve widget:2 --key=ci-8123 | awk '{print $1}' | tr -d '\r')
          test "$held" = "$again"
          docker compose run --rm tillctl stock widget | grep -q 'available=98'

          docker compose run --rm tillctl commit "$held"
          docker compose run --rm tillctl stock widget | grep -q 'onHand=98'

      - name: refusals are refusals
        run: |
          set -euo pipefail
          # Exit code 1 and a shortfall on stderr, not a stack trace.
          if docker compose run --rm tillctl reserve widget:5000 > /tmp/out 2> /tmp/err; then
            echo "expected a refusal"; exit 1
          fi
          grep -q INSUFFICIENT_STOCK /tmp/err

      - name: metrics are scrapeable and health is honest
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:9101/actuator/prometheus | grep -q 'till_outcome_total'
          curl -sf http://127.0.0.1:9101/actuator/health/readiness | grep -q '"status":"UP"'
          # The API port must not serve the management endpoints, and must want a token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/stock/widget)" = 401

      - name: the image serves the console
        run: |
          set -euo pipefail
          # The README says `docker compose up` gives you a shop. An image built without -Pweb would
          # pass every other step in this job and answer 404 here.
          curl -sf http://127.0.0.1:8080/ | grep -q '<title>till</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ops)" = 200

      - name: the stock survives a restart
        run: |
          set -euo pipefail
          docker compose restart till
          docker compose up -d --wait
          docker compose run --rm tillctl stock widget | grep -q 'onHand=98'

      # Always, not only on failure: when this job goes red the first question is whether the
      # containers were even running, and the answer should not require re-running it.
      - name: container state
        if: always()
        run: |
          docker compose ps
          echo "--- health ---"
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q till)" | head -c 800 || true
          echo
          echo "--- logs ---"
          docker compose logs --no-color --tail=120

      - name: tear down
        if: always()
        run: docker compose down -v

  clean-clone:
    name: a clean clone builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # No warm cache and no local repository. A declared module that was never committed, or a
      # dependency that only resolves because it is already on this machine, breaks a clone without
      # breaking the maintainer.
      - run: mvn -B -ntp -Dmaven.repo.local=/tmp/fresh-repo package -DskipTests
