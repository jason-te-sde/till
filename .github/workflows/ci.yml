name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The whole job is about two minutes. Anything approaching this is hung, and the six hour default
    # means a hung job holds a runner for an afternoon before anyone notices.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    services:
      # A service container rather than Testcontainers, so that the suite is not paying to start a
      # container twice. TILL_TEST_DB_URL names the server; each module creates a database of its
      # own on it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U till -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TILL_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      TILL_TEST_DB_USER: till
      TILL_TEST_DB_PASSWORD: till

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compiles with -Werror, runs every test, and enforces that each declared module exists and
      # that dependency versions converge across modules.
      - name: verify
        run: mvn -B -ntp verify

      # CI is set, so RequiresDatabase fails rather than skips when it cannot reach a database. This
      # asserts the other half: that the suites which need one actually ran. A build where they all
      # skipped is the failure this project is most exposed to.
      - name: the database-backed suites actually ran
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' till-jdbc/target/surefire-reports/*.xml \
                      till-server/target/surefire-reports/*.xml \
                    | grep -o '[0-9]*' | paste -sd+ - | bc)
          ran=$(grep -ho 'tests="[0-9]*"' till-jdbc/target/surefire-reports/*.xml \
                  till-server/target/surefire-reports/*.xml \
                | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "postgres-backed modules: $ran tests, $skipped skipped"
          test "$skipped" -eq 0
          test "$ran" -gt 50

      # Same argument for the broker-backed ones, which start their own containers rather than
      # using the service above. A suite that silently found no Docker and passed anyway is the
      # exact failure this project keeps guarding against.
      - name: the broker-backed suites actually ran
        run: |
          ran=$(grep -ho 'tests="[0-9]*"' till-kafka/target/surefire-reports/*.xml \
                  till-store/target/surefire-reports/*.xml \
                | grep -o '[0-9]*' | paste -sd+ - | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' till-kafka/target/surefire-reports/*.xml \
                      till-store/target/surefire-reports/*.xml \
                    | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "kafka-backed modules: $ran tests, $skipped skipped"
          test "$skipped" -eq 0
          test "$ran" -gt 15

      # Surefire already wrote the failing assertion and its stack trace to disk. Without this they
      # are deleted when the job ends, and the summary says only that Maven exited non-zero, so
      # diagnosing a red run means downloading the raw log and grepping it.
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U till -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TILL_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      TILL_TEST_DB_USER: till
      TILL_TEST_DB_PASSWORD: till

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One JDK rather than the matrix: the JaCoCo agent has to understand the class file version it
      # runs against, which makes it the first thing to break on a new JDK release.
      - run: mvn -B -ntp verify -Dcoverage

      - name: summary
        run: |
          python3 - <<'PY'
          import csv, pathlib
          lm = lc = bm = bc = 0
          for path in sorted(pathlib.Path('.').rglob('jacoco.csv')):
              module_lm = module_lc = 0
              with path.open() as handle:
                  for row in csv.DictReader(handle):
                      module_lm += int(row['LINE_MISSED']); module_lc += int(row['LINE_COVERED'])
                      bm += int(row['BRANCH_MISSED']); bc += int(row['BRANCH_COVERED'])
              lm += module_lm; lc += module_lc
              total = module_lm + module_lc
              if total:
                  print(f"{str(path.parts[0]):16} {100 * module_lc / total:5.1f}% lines")
          print(f"{'overall':16} {100 * lc / (lm + lc):5.1f}% lines, {100 * bc / (bm + bc):5.1f}% branches")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          retention-days: 7

  web:
    # The storefront. The job keeps the name it had when the frontend was an operator console, because
    # the repository's ruleset requires checks by name: renaming a job means changing the ruleset in
    # the same change, or every pull request waits forever for a check that no longer reports.
    name: the console (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The version the Maven build pins, and the next one. Same reasoning as the JDK matrix: a
        # lint or a type rule that changes between releases should fail before it is released.
        node: ['24', '26']
    defaults:
      run:
        working-directory: till-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: till-web/package-lock.json

      # `ci`, not `install`: it installs exactly the lock file and fails if the lock and the
      # manifest disagree.
      - run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test:coverage

      # openapi/store.json is what the TypeScript types are generated from, and the store's own test
      # keeps that file current. If regenerating the types changes them, somebody changed the API and
      # did not regenerate — which is a frontend compiling against types for an API that no longer
      # exists.
      - name: the generated types are current
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run api:types' in till-web and commit it."
            exit 1
          }

      - name: build
        run: npm run build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-coverage-node${{ matrix.node }}
          path: till-web/coverage/**
          retention-days: 7

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Every image the stack runs, built once with a cache shared across runs: the Maven and npm
      # dependency layers are most of the wall time, and they change far less often than the code.
      - name: build the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # The whole platform, as the README starts it: edge, store, ledger, Kafka, Postgres, Redis and
      # Keycloak. --wait blocks until every health check passes, so a stack that cannot start fails
      # here, by name, rather than as a browser test timing out.
      - name: bring the stack up
        run: docker compose up -d --wait

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: till-web/package-lock.json

      - name: install the browser
        working-directory: till-web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # A customer and an operator, driven through the real sign-in at Keycloak, a real hold in the
      # ledger, and stock that travels through Kafka to the storefront.
      - name: run it
        working-directory: till-web
        env:
          CI: 'true'
          TILL_WEB: http://localhost:8080
        run: npx playwright test

      - name: stack logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150 store edge keycloak

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            till-web/playwright-report/**
            till-web/test-results/**
          retention-days: 7

      - name: tear down
        if: always()
        run: docker compose down -v

  container:
    name: the container stack works
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: build the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: bring the stack up
        run: docker compose up -d --wait

      # The README claims this works. Claiming it and checking it are different things, and a
      # Dockerfile that has never been built is documentation of an intention.
      - name: a hold, a replay, and a sale
        run: |
          set -euo pipefail
          docker compose run --rm tillctl adjust widget 100
          held=$(docker compose run --rm tillctl reserve widget:2 --key=ci-8123 | awk '{print $1}' | tr -d '\r')
          test -n "$held"

          # The same key again. It must return the same reservation and take nothing more.
          again=$(docker compose run --rm tillctl reserve widget:2 --key=ci-8123 | awk '{print $1}' | tr -d '\r')
          test "$held" = "$again"
          docker compose run --rm tillctl stock widget | grep -q 'available=98'

          docker compose run --rm tillctl commit "$held"
          docker compose run --rm tillctl stock widget | grep -q 'onHand=98'

      - name: refusals are refusals
        run: |
          set -euo pipefail
          # Exit code 1 and a shortfall on stderr, not a stack trace.
          if docker compose run --rm tillctl reserve widget:5000 > /tmp/out 2> /tmp/err; then
            echo "expected a refusal"; exit 1
          fi
          grep -q INSUFFICIENT_STOCK /tmp/err

      # Output is captured before it is searched: `curl | grep -q` under pipefail fails whenever grep
      # finds its match and exits before curl has finished writing.
      - name: metrics are scrapeable and health is honest
        run: |
          set -euo pipefail
          grep -q 'till_outcome_total' <<< "$(curl -sf http://127.0.0.1:9101/actuator/prometheus)"
          grep -q '"status":"UP"' <<< "$(curl -sf http://127.0.0.1:9101/actuator/health/readiness)"
          grep -q '"status":"UP"' <<< "$(curl -sf http://127.0.0.1:9102/actuator/health/readiness)"
          # The ledger's API port must not serve the management endpoints, and must want a token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/v1/stock/widget)" = 401

      - name: the edge serves the store, and only the store
        run: |
          set -euo pipefail
          grep -q '<title>till games</title>' <<< "$(curl -sf http://localhost:8080/)"
          # A route the SPA draws is the app, with the policy that forbids inline script.
          headers=$(curl -s -D - -o /dev/null http://localhost:8080/games/sunless-orbit)
          grep -q '^HTTP/1.1 200' <<< "$headers"
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self'" <<< "$headers"
          grep -qi '^x-frame-options: DENY' <<< "$headers"
          # The API behind it answers as JSON problems, never as pages.
          curl -sf http://localhost:8080/api/me | jq -e '.authenticated == false' > /dev/null
          body=$(curl -s -w '\n%{http_code}' http://localhost:8080/api/orders)
          test "$(tail -1 <<< "$body")" = 401
          head -1 <<< "$body" | jq -e '.code == "UNAUTHORIZED"' > /dev/null
          # Nothing of the ledger is reachable through the edge, even holding the ledger's own admin
          # token: a path the storefront does not draw is still the storefront, never the ledger.
          grep -q '<title>till games</title>' <<< "$(curl -s -H 'Authorization: Bearer demo-admin-token' \
            http://localhost:8080/v1/stock)"

      # The reason Kafka is in this stack at all. If the outbox never reached the broker, or the
      # consumer never started, or the headers drifted, the storefront's availability never moves and
      # this step is what says so.
      - name: an event reaches the storefront
        run: |
          set -euo pipefail
          available() { curl -sf http://localhost:8080/api/games/sunless-orbit | jq -r .game.available; }
          # The store stocks every game once at start-up, through the ledger. Wait until that has
          # been projected, so the number read next is not about to jump by the seed's fifty.
          for i in $(seq 1 60); do
            asof=$(curl -sf http://localhost:8080/api/games/sunless-orbit | jq -r .game.availabilityAsOf)
            if [ "$asof" != null ]; then break; fi
            sleep 1
          done
          before=$(available)
          docker compose run --rm tillctl adjust sunless-orbit 12
          for i in $(seq 1 45); do
            if [ "$(available)" = "$((before + 12))" ]; then echo "projected after ${i}s"; break; fi
            sleep 1
          done
          test "$(available)" = "$((before + 12))"

      - name: the storefront cannot move stock
        run: |
          set -euo pipefail
          # Checkout holds a client token, so the ledger refuses an adjustment made with it. The whole
          # argument for splitting the services is that this is impossible rather than merely absent.
          code=$(docker compose exec -T store sh -lc \
            'curl -s -o /dev/null -w "%{http_code}" -X POST \
               -H "Authorization: Bearer $TILL_CLIENT_TOKEN" \
               -H "Idempotency-Key: ci-should-fail" -H "Content-Type: application/json" \
               -d "{\"delta\":1000}" http://till:8080/v1/stock/sunless-orbit/adjust')
          test "$code" = 403

      - name: the catalogue is cached at the edge
        run: |
          set -euo pipefail
          # The first answer sets the CSRF cookie, and nginx never caches a response that sets one;
          # with the cookie sent back, the next answers are cacheable and the third is a hit.
          for i in 1 2 3; do
            curl -s -b /tmp/jar -c /tmp/jar -D - -o /dev/null http://localhost:8080/api/home | grep -i '^x-cache-status:' || true
          done | tee /tmp/cache
          grep -qi 'x-cache-status: HIT' /tmp/cache

      - name: a flood is refused politely
        run: |
          set -euo pipefail
          # Thirty a second per address with a burst of sixty; three hundred at once must be cut.
          seq 1 300 | xargs -P 60 -I{} curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/api/me \
            | sort | uniq -c | tee /tmp/codes
          grep -q ' 429$' /tmp/codes
          sleep 2
          curl -s http://localhost:8080/api/me > /dev/null
          # And the refusal is a problem the SPA can read, not nginx's HTML page.
          seq 1 200 | xargs -P 60 -I{} curl -s http://localhost:8080/api/me > /tmp/bodies
          grep -q '"code":"RATE_LIMITED"' /tmp/bodies

      - name: the stock survives a restart
        run: |
          set -euo pipefail
          docker compose restart till
          docker compose up -d --wait
          docker compose run --rm tillctl stock widget | grep -q 'onHand=98'

      # Always, not only on failure: when this job goes red the first question is whether the
      # containers were even running, and the answer should not require re-running it.
      - name: container state
        if: always()
        run: |
          docker compose ps
          echo "--- logs ---"
          docker compose logs --no-color --tail=120

      - name: tear down
        if: always()
        run: docker compose down -v

  kafka-cluster:
    # docker-compose.kafka-cluster.yml's three brokers instead of the one in docker-compose.yml —
    # the local equivalent of infra/'s three ECS services — so the replication factor 3,
    # min.insync.replicas 2 configuration is actually run somewhere, not only declared
    # (docs/design/0010-kafka-replication.md). Only the ledger and what it needs: the storefront,
    # Redis and Keycloak have nothing to do with replication, and not starting them is most of why
    # three Kafka JVMs here do not cost what they look like they should next to "the container
    # stack works".
    name: the Kafka cluster survives losing a broker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: build the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.kafka-cluster.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: bring up the ledger on three brokers
        run: docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml up -d --wait till

      # tillctl talks to the ledger that is already up; --no-deps is what keeps this from being a
      # test of nothing, because `run` otherwise starts any stopped dependency first — including,
      # later in this job, the broker the step just stopped on purpose.
      - name: the topic the ledger declares has three replicas, and two in sync is enough to write
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml run --rm --no-deps \
            tillctl adjust widget 100
          description=$(docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml exec -T kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --describe --topic till.events)
          echo "$description"
          grep -q 'ReplicationFactor: 3' <<< "$description"
          grep -q 'min.insync.replicas=2' <<< "$description"

      - name: one broker down, the stream still delivers
        run: |
          set -euo pipefail
          compose() { docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml "$@"; }
          offsets() {
            compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server 127.0.0.1:9092 \
              --topic till.events --time -1 | awk -F: '{sum += $3} END {print sum + 0}'
          }

          before=$(offsets)
          compose stop kafka-3
          compose run --rm --no-deps tillctl adjust widget 7

          for i in $(seq 1 30); do
            [ "$(offsets)" -gt "$before" ] && break
            sleep 2
          done
          after=$(offsets)
          echo "offsets on till.events: $before -> $after, with kafka-3 stopped"
          test "$after" -gt "$before"

          state=$(compose ps -a kafka-3 --format '{{.State}}')
          echo "kafka-3 is $state"
          test "$state" = exited

      - name: two brokers down, a send fails instead of being acknowledged
        run: |
          set -euo pipefail
          compose() { docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml "$@"; }
          offsets() {
            compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server 127.0.0.1:9092 \
              --topic till.events --time -1 | awk -F: '{sum += $3} END {print sum + 0}'
          }
          # Absent until the first failure increments it, which grep then does not find: that is
          # also "zero", not an error this should stop on.
          failures() {
            curl -sf http://127.0.0.1:9101/actuator/prometheus | grep '^till_outbox_failures_total ' | awk '{print $2}' || echo 0
          }

          before=$(offsets)
          compose stop kafka-2
          # The ledger's own write succeeds regardless — it only touches its database
          # (docs/design/0006-outbox.md) — and the batch is offered to Kafka on the next tick,
          # where min.insync.replicas=2 cannot be met by the one broker left.
          compose run --rm --no-deps tillctl adjust widget 3

          for i in $(seq 1 20); do
            [ "$(failures)" != 0 ] && break
            sleep 3
          done
          echo "till_outbox_failures_total: $(failures)"
          test "$(failures)" != 0
          echo "offsets on till.events: $before -> $(offsets) (must be unchanged)"
          test "$(offsets)" = "$before"

      - name: the backlog drains once the brokers are back
        run: |
          set -euo pipefail
          compose() { docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml "$@"; }
          compose start kafka-2 kafka-3
          for i in $(seq 1 30); do
            backlog=$(curl -sf http://127.0.0.1:9101/actuator/prometheus | grep '^till_outbox_backlog ' | awk '{print $2}')
            [ "$backlog" = "0.0" ] && break
            sleep 2
          done
          echo "till_outbox_backlog: $backlog"
          test "$backlog" = "0.0"

      - name: container state
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml ps -a
          echo "--- logs ---"
          docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml logs --no-color --tail=150 kafka kafka-2 kafka-3 till

      - name: tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml down -v

  clean-clone:
    name: a clean clone builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # No warm cache and no local repository. A declared module that was never committed, or a
      # dependency that only resolves because it is already on this machine, breaks a clone without
      # breaking the maintainer.
      - run: mvn -B -ntp -Dmaven.repo.local=/tmp/fresh-repo package -DskipTests

  infra:
    name: the AWS deployment is well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.16'
          terraform_wrapper: false
      # No credentials and no backend: this proves the configuration is formatted, consistent and
      # typed against the provider it locks, not that AWS would accept it. scripts/aws.sh plan does
      # that, and `up` runs checks against what it deployed.
      - name: formatted
        run: terraform fmt -check -recursive -diff infra
      - name: valid
        run: |
          set -euo pipefail
          for stack in infra infra/bootstrap; do
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly > /dev/null
            terraform -chdir="$stack" validate
          done
      - name: the scripts pass shellcheck
        run: shellcheck scripts/*.sh
      - name: the load test's scenario parses
        run: docker run --rm -v "$PWD/till-loadtest/k6:/k6:ro" grafana/k6:2.3.0 inspect /k6/shopper.js > /dev/null

  loadtest:
    name: the load test runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: build the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yml
            till-loadtest/compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: bring the stack up the way the load test runs it
        run: docker compose -f docker-compose.yml -f till-loadtest/compose.yml up -d --wait

      # Not a measurement: a runner's number says nothing about the platform's (docs/load-test.md).
      # What it proves is that the scenario still works from end to end — signing in against the
      # stand-in, ordering, paying — with every response the expected one. Half the shoppers check
      # out, so that a thirty-second run is sure to sign some in.
      - name: a short run
        env:
          SHOPPERS: "20"
          RAMP: 10s
          HOLD: 30s
          RAMP_DOWN: 5s
          CHECKOUT_SHARE: "0.5"
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f till-loadtest/compose.yml run --rm k6 | tee /tmp/k6.log
          result=$(grep '^RESULT ' /tmp/k6.log | cut -c8-)
          test -n "$result"
          jq -e '.unexpected_rate == 0 and .per_second.sign_ins > 0 and .per_second.orders_placed > 0
                 and .per_second.orders_paid > 0' <<< "$result" > /dev/null

      - name: tear down
        if: always()
        run: docker compose -f docker-compose.yml -f till-loadtest/compose.yml down -v
