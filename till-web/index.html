<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>till</title>
    <meta name="description" content="The browser console for till: a shop front and an operator view of the ledger." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applied before the first paint, so a dark-themed console does not flash light on load. The
      // toggle writes this key; everything else about theming is in CSS.
      try {
        var stored = localStorage.getItem('till.theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
        }
      } catch (ignored) {
        // Private browsing with storage denied. The OS setting still applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
