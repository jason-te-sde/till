# Kafka's clients log their entire resolved configuration at INFO on every producer and consumer
# construction — several hundred lines per test, which buries the assertion failure you are
# actually looking for. Warnings and errors still come through, which is all this suite needs.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.log.org.testcontainers=warn
org.slf4j.simpleLogger.log.tc=warn
org.slf4j.simpleLogger.log.com.github.dockerjava=warn
