# The edge's nginx.conf, in place of the image's. What the edge does is in
# templates/default.conf.template; this is only how many connections it may hold and for how long.

worker_processes auto;
# A file descriptor for every connection, and a proxied request holds two.
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
  # The image's 1,024 a worker ran out within seconds of eight thousand shoppers
  # (docs/load-test.md): behind a load balancer every request arrives over a connection the balancer
  # keeps open, and each one proxied to the store holds a second.
  worker_connections 16384;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;

  # Longer than the load balancer's idle timeout of 60 s, so that an idle connection is always
  # closed by the balancer: when the edge closes one first, a request the balancer is sending down
  # it at that moment comes back a 502. And many requests to a connection, for the same reason —
  # nginx's default closes each after a thousand, which is the same race a thousand times as often.
  keepalive_timeout 75s;
  keepalive_requests 100000;

  include /etc/nginx/conf.d/*.conf;
}
