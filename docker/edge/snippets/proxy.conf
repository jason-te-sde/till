# How every request reaches the store.
proxy_http_version 1.1;
proxy_set_header Connection "";

# The store builds absolute URLs — the OAuth redirect URI above all — from these, so they must name
# the address the browser used. $http_host rather than $host, because $host drops the port, and a
# redirect to localhost instead of localhost:8080 is a sign-in that lands nowhere.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Cleared rather than passed on: the port is in X-Forwarded-Host, and a client-supplied one would
# override it.
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 3s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;

# The edge sets the security headers for everything it serves; the store's own copies would only
# duplicate them.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-XSS-Protection;
