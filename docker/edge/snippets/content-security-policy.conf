# The SPA's policy. Scripts only from this origin — the theme script is a file for exactly this reason
# — and requests only to this origin, so an injected script has nowhere to send what it reads.
# 'unsafe-inline' for styles only, because React writes style attributes; styles cannot exfiltrate.
# data: images for the cover art's grain texture.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
