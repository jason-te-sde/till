spring:
  application:
    name: till-catalogue
  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://127.0.0.1:5432/catalogue}
    username: ${CATALOGUE_DB_USER:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${CATALOGUE_PORT:8081}
  shutdown: graceful

catalogue:
  till:
    base-url: ${TILL_URL:http://127.0.0.1:8080}
    # The client token, never the admin one. A storefront reserves, commits and releases; moving
    # stock levels is not something a shop front does, and holding the token that could would make
    # this service worth compromising.
    token: ${TILL_CLIENT_TOKEN:}
    timeout: 5s
  kafka:
    # Blank means do not consume. The shop still serves — titles and prices come from this service's
    # own tables — and availability stays at whatever was last projected. A broker outage should make
    # the numbers stale, not the shop unreachable.
    bootstrap-servers: ${CATALOGUE_KAFKA_BROKERS:}
    topic: ${TILL_KAFKA_TOPIC:till.events}
    # One group across every instance, so an event is projected once rather than once per replica.
    group-id: till-catalogue
    poll-timeout: 500ms

management:
  server:
    port: ${CATALOGUE_MANAGEMENT_PORT:9102}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
